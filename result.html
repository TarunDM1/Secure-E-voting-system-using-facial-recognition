{% extends "base.html" %}
{% block content %}

<style>
  .result-wrap{
    min-height: 60vh;
    display: grid;
    place-items: center;
  }
  .result-card{
    max-width: 520px;
    width: 100%;
    border-radius: 18px;
  }
  .result-icon{
    width:64px;height:64px;border-radius:999px;
    display:grid;place-items:center;
    font-size:32px;
    margin:0 auto 12px auto;
  }
  .icon-ok{
    background: rgba(25,135,84,.15);
    color:#198754;
  }
  .icon-fail{
    background: rgba(220,53,69,.15);
    color:#dc3545;
  }
</style>

<div class="result-wrap">
  <div class="card shadow-sm result-card">
    <div class="card-body p-4 text-center">

      {% if ok %}
        <div class="result-icon icon-ok">✓</div>
        <h4 class="text-success fw-bold">Success</h4>
      {% else %}
        <div class="result-icon icon-fail">✕</div>
        <h4 class="text-danger fw-bold">Failed</h4>
      {% endif %}

      <p class="text-muted mt-2 mb-4">
        {{ message }}
      </p>

      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a class="btn btn-primary" href="/">Back to Login</a>

        {% if ok %}
          <a class="btn btn-outline-secondary" href="/">Go Home</a>
        {% else %}
          <a class="btn btn-outline-danger" href="javascript:history.back()">Try Again</a>
        {% endif %}
      </div>

    </div>
  </div>
</div>

{% endblock %}
